- name: Deploy Animal Adoption Platform
  hosts: local
  connection: local
  become: yes

  vars:
    project_dir: /opt/animal-adoption-platform
    deploy_user: ansible         
    deploy_group: ansible
    rsync_excludes:
      - .git
      - node_modules
      - backend/node_modules
      - frontend/node_modules
      - .env
      - .env.local
      - .env.*
      - dist
      - build
      - .DS_Store
      - "*.log"
      - docker/mongodb-init/*.secret
      - tests
      - coverage
      - .vscode
      - .idea

  tasks:
    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        state: present
        create_home: yes
      become: yes

    - name: Create project directory if missing
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"

    - name: Sync repository to target folder using rsync with excludes
      synchronize:
        src: "{{ playbook_dir }}/.."
        dest: "{{ project_dir }}"
        delete: yes
        recursive: yes
        rsync_opts: "{{ rsync_excludes | map('regex_replace','^','--exclude=') | list }}"

    - name: Ensure ownership is correct after synchronization
      file:
        path: "{{ project_dir }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        recurse: yes

    - name: Ensure docker-compose network exists
      community.docker.docker_network:
        name: shared-net
        driver: bridge
        state: present

    - name: Bring up main backend/frontend stack 
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}/docker"
        pull: missing
        build: always
        state: present

    - name: Bring up monitoring/logging stack 
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}/docker"
        files:
          - docker-compose.monitoring.yml
        pull: missing
        build: always
        state: present
