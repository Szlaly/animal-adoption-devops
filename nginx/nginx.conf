events {}

http {
    server {
        listen 80;

        # --- FRONTEND ---
        location / {
            proxy_pass http://frontend:4200;
            proxy_set_header Host $host;
        }

        # --- BACKEND ---
        location /api/ {
            proxy_pass http://backend:5000/;
            proxy_set_header Host $host;
        }
    }
}
